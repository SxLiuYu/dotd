# mcp-servers.voice.yml —— 把 Charlie 的宿主工具接进 dotd（2026-10-23）
#
# ⚠ 默认**不生效**。启用方式（二选一）：
#   A. 把下面内容并进 config/mcp-servers.yml 的 servers 列表；
#   B. 启动 daemon 时指定：DOTD_MCP_CONFIG=config/mcp-servers.voice.yml
#
# 前置条件：
#   - Python 3.10+，且装了 Charlie 的依赖（至少 `mcp`、`requests`）：
#       npm run setup:all      # 建 .venv 并装 voice/requirements-voice.txt
#   - **不要写 `command: python`**（2026-10-26 现场教训）：Debian/Ubuntu/WSL 默认
#     只提供 `python3`，没有 `python`；而系统 `python3` 里通常没有 `mcp` 包
#     （`ModuleNotFoundError`），依赖只装在仓库的 `.venv` 里。
#     所以这里用 `node scripts/py.mjs` —— 它就是仓库里所有 Python 入口用的那个
#     解析器（显式 DOTD_PYTHON → 当前平台 .venv → python3 → python），
#     并把 stdio 原样透传，MCP 的 JSON-RPC 帧不受影响。
#
# 路径口径（两种都行，别混着理解）：
#   - `scripts/py.mjs` 由 **daemon 的 cwd** 解析 —— 仍要求从仓库根启动 daemon
#     （`wsl-daemon.sh` 和 `one_system` 都是这么做的）；换 cwd 就写绝对路径。
#   - 后面那个 `.py` 由 **py.mjs** 解析，它自己 `cwd=仓库根` 再 spawn python，
#     所以 `voice/charlie/...` 与 daemon 的 cwd 无关。
#
# 安全语义（不要放宽）：
#   - mcp.call 在 dotd 里是 dangerous 档；`DOTD_APPROVALS=on` 时每次都要主人审批。
#     产品默认 `DOTD_APPROVALS=off`（2026-10-26 主人要求去掉审批），这一档直通，
#     但仍写 decisions + audit（reason 带 `approvals=off`），事后能筛出来；
#   - allow_tools 是白名单：server 后来多出工具，模型也调不到；
#   - 这些 server 跑在**宿主**（不是容器），因为它们要碰红外/涂鸦/ESP32。

servers:
  - name: charlie-scenes
    command: node
    args: ["scripts/py.mjs", "voice/charlie/magic-scenes.py"]
    timeout_ms: 60000
    allow_tools:
      - goodnight
      - good_morning
      - movie_time
      - leaving_home
      - execute_scene
      - list_protocols

  - name: charlie-reminders
    command: node
    args: ["scripts/py.mjs", "voice/charlie/magic-reminder.py"]
    timeout_ms: 30000
    allow_tools:
      - add_reminder
      - list_reminders
      - delete_reminder
      - set_timer
      - get_calendar_today
      - schedule_task
      - list_alarms

  # 家居控制（2026-10-26）：空调/灯/插座。工具本体是
  # voice/integration/home_devices.py 的 HomeController —— 与语音反射层
  # （cortex_router 的 home 反射）**同一份**代码、同一份设备清单。
  # 清单路径：HOME_DEVICES_FILE → $CHARLIE_DATA_DIR/home-devices.yml → ~/.charlie/home-devices.yml
  # 白名单只放四个显式动作工具，没有"随便发一条指令"的口子。
  - name: charlie-home
    command: node
    args: ["scripts/py.mjs", "voice/charlie/magic-home.py"]
    timeout_ms: 30000
    allow_tools:
      - home_list
      - home_control
      - home_status
      - home_reload
