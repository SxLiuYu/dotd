# tools.yml —— 工具档位目录（GOV §2.2 语义 + 契约 M5/§9.1 的 11 名工具词表）
#
# 词表来源（§9.1 目录树注释点名，与接缝契约 M5、EX §5.3 ToolName 逐字一致）：
#   fs.read / fs.write / fs.list / fs.stat / shell.run
#   browser.open / browser.act / browser.snapshot / browser.close / net.get / net.post
# 共 11 个。治理 tools.yml 登记这 11 个名字（契约 M5）。
#
# 与 GOV §2.2 原示例的差异（原示例已被下述裁决取代，不是漏抄）：
#   1. 工具名按 §9.1/M5/EX §5.3 定稿：原稿的 browser.navigate→browser.open、
#      browser.purchase→（取消，购物即 browser.act）、shell.exec→shell.run。
#   2. **无 identityParam 字段**：接缝契约 G1 裁决，登录态谓词改顶层 ToolCall.identity，
#      GOV §2.2/§2.3 的 identityParam 字段与 zod 必填校验作废（契约 G1 连锁修改）。
#   3. browser.* 五档归类按 GOV 五档制 + §9.3 默认策略（browser→review）。
#
# 档位五档（GOV §2，§9.3 默认策略）：read / write_file / browser / spend / dangerous
#   read/write_file→allow；browser→review（低智能前审放行，判危转人工）；
#   spend→approve 一律人工；dangerous→approve+Web 勾选确认。
#   upgrade.whenContains 子串命中提档；rules.yml 只能收紧不能放宽；未登记工具一律 deny。

tools:
  - name: fs.read
    tier: read
    # 限额分层（契约 M6）：EX 物理兜底 fs.read≤4MB；MEM 策略层更严者生效
  - name: fs.write
    tier: write_file
    pathPrefixes: ["/dot/home/"]           # 写范围约束，执行面同享此契约（GOV §2.2/S2）
    # 限额分层（契约 M6）：EX 物理兜底 fs.write≤8MB
  - name: fs.list
    tier: read
    # EX §7：目录枚举/mtime/size，深度 ≤4
  - name: fs.remove
    # **dangerous 而不是 write_file**（2026-10-19 实测改）：
    # 最初定 write_file，结果模型面对"用 rm -rf 删目录"（shell.run 会触发审批）时
    # **改用 fs.remove 逐个删**，完全绕过审批。归档可恢复是对的，但"绕过审批"不行。
    # 删除是破坏性动作，按 GOV 五档该进人工确认。
    tier: dangerous
  - name: fs.stat
    tier: read
    # EX §7：mtime/size
  - name: fs.grep
    tier: read
    # 2026-10-22 补登：能力表/工具目录/容器实现三处都有它，唯独治理白名单漏了，
    # 而 gate.ts:327 是「未登记 ⇒ deny」——模型看得见工具名、却每次都拿到 deny。
    # 只读检索 /dot/home 下文件内容（回路径+行号），无副作用 ⇒ read。
  - name: memory.search
    tier: read
    # 2026-10-22 补登，原因同上：宿主侧 daemon.ts:1692 已注册实现，白名单没登记。
    # 查 mem_messages（含已被挤出上下文的对话），与 fs.grep 查文件分工不同。
    # 只读本地库 ⇒ read。
  - name: shell.run
    tier: write_file                        # 容器内 shell（EX §7：bash -c，cwd=/dot/home，超时必填）
    upgrade:                                # 命中即提档（解析规则见 GOV §3.1）
      tier: dangerous
      # **出网命令必须在此**（2026-10-19 实测发现）：容器里 curl/wget/python 都能出网，
      # 而 DOTD_NET_TOOLS=get 只限制 net.* 工具 —— 模型用 `curl -X POST` 就能完全绕过
      # net.post 的管控（实测 curl POST 拿到 HTTP 200）。同理 nc/telnet/ssh 等也是通路。
      # 加这一批的代价：正常的"用 curl 抓个网页"会走审批。这是有意的 ——
      # 想抓网页请用 net.get（read 档，直接放行），shell 里的网络命令一律当危险动作。
      # 匹配对象是**整个 JSON 参数**（gate.ts upgradeHit: JSON.stringify(params) 子串命中），
      # 所以 /`https://` 这种"URL 形态"词能一网打尽所有出网写法（curl/wget/python urllib/
      # git clone/node fetch…），比穷举命令名可靠得多。2026-10-19 实测：
      # 只列 curl/wget 时，`python3 -c "import urllib.request; urlopen('https://…')"` 直接绕过。
      whenContains: ["rm ", "sudo ", "docker ", "> /dev/", "http://", "https://", "ftp://", "ssh://", "rmdir", "unlink", "shred", "truncate", "curl ", "wget ", "nc ", "ncat", "telnet ", "ssh ", "scp ", "rsync "]
  - name: browser.open
    tier: read                              # 只导航不交互
  - name: browser.act                       # click/type/submit 合并为一个动作工具
    tier: browser                           # §9.3：browser→review
    # 登录态判定不在此声明（契约 G1 作废 identityParam）：
    # isLoginSensitive(call) = call.tool.startsWith('browser.')
    #                          && call.identity != null && call.identity !== 'anon'
  - name: browser.snapshot
    tier: read                              # 读取当前页面结构，无副作用
  - name: browser.screenshot            # 只读动作：PNG 落盘，不与页面交互
    tier: read
  - name: browser.close
    tier: read                              # 关 context，profile 留卷上（EX §5.5）
  - name: net.get
    tier: read
  - name: net.post
    tier: write_file                        # 对外 POST 有副作用：比 GET 高一档（GOV §2.2）

  # ── 定时任务（2026-10-18，对标 OpenAI bot 的"每天 9 点提醒我"）──────────────
  # 这两个是**宿主侧工具**：由 daemon 直接执行（改 crontabs 表），不进容器。
  # 为什么 schedule.create 是 write_file 档：它会在控制面创建一条长期存在的调度记录，
  # 到点自动触发任务 —— 属于"改了系统状态"，不是只读查询。
  - name: schedule.create
    tier: write_file
  - name: schedule.remove
    tier: write_file                        # 停用而非硬删（enabled=0，可恢复）
  - name: schedule.list
    tier: read

  # ── P2-1：外部工具网关（MCP）──────────────────────────────────────────────
  # 为什么是 dangerous 而不是 spend/write_file：
  #   spend 要求 spendParams.required（金额等固定字段），而 MCP 工具的参数是**任意**的，
  #   无法预先声明"要花多少钱"——用 spend 会被 catalog 校验拒掉（GOV §2.3）。
  #   dangerous 才是这里唯一正确的档：
  #     - 一律人工审批（approve_once，不参与 `all` 批量批准）；
  #     - 应急模式（EMERGENCY）直接冻结（gate.ts:392）；
  #     - 治理审计里带 tier，复盘能一眼看出"这是外部工具"。
  # **这条不要放宽**：外部 MCP server 的行为我们不知道，它可能在宿主上发网络请求、
  # 读环境变量、写任意文件。给它 write_file/read 档等于让用户无感地执行第三方代码。
  #
  # 默认**不启用**：本条目只声明"如果 mcp.call 出现，按最严档管"。
  # 是否真的出现，取决于 config/tools.yml 的 mcp_servers 段是否声明了 server
  # （空 = 完全不启用，模型看不到这个工具）。
  - name: mcp.call
    tier: dangerous

  # ── 自造工具（S2，2026-10-19）────────────────────────────────────────
  # 让 dotd 把写过的脚本沉淀成可复用工具，不再"写完就丢"。
  #
  # 档位理由：
  #  - tool.list  read：只读目录，无副作用
  #  - tool.create dangerous：**写一个可执行文件**，下次还会自动跑它。
  #    这等价于"让 AI 往系统里种代码"，必须主人点头（GOV 五档里 dangerous=人工审批）。
  #  - tool.invoke dangerous：执行一个**之前生成的、现在没人看过的**脚本。
  #    主人批准的是"造"的那一刻，不是"每次跑"——所以跑也要批。
  #    如果以后发现太繁琐，可降为 write_file + 首次执行审批，但**默认从严**。
  - name: tool.list
    tier: read
  - name: tool.create
    tier: dangerous
  - name: tool.invoke
    tier: dangerous

# ── spend 档条目（结构定型，§9.3：花钱一律人工审批）──────────────────────────
# GOV §2.3 校验细则：tier == "spend" 的条目必须带 spendParams（缺则加载失败）。
# 阶段一工具词表（§9.1/M5）无 spend 档工具；购物走 browser.act 由 review 承接。
# 阶段二接入支付/下单类工具时按此形状补条目（含 spendParams.required）：
#
#   - name: shop.checkout
#     tier: spend
#     spendParams:
#       required: [amountCents, currency, category]
# ─────────────────────────────────────────────────────────────────────────────

# ── 邮件（2026-10-20，T1/T2：对标 Meta Muse 的「跟进邮件」场景）──────────────
#
# 为什么单独一组：Muse 最有价值的实测任务就是"查邮件、判断进度、起草回复"。
# 这里六个工具，四个只读一个起草一个发送。
#
# 为什么通用 IMAP/SMTP 而不是 Gmail API：
#   IMAP 是 1986 年的标准，163/QQ/Outlook/自建全支持。Gmail API 要 OAuth 审核、
#   要回调域名、要 refresh token 轮换 —— 换一家邮箱就得重写一遍。
#
# 分档依据（GOV §2.2 的"副作用"定义）：
#   - mail.list / mail.read / mail.search：只读远端，不改变任何状态 ⇒ read
#   - mail.draft：正文只写进自己的库，**对方收不到** ⇒ read（不起草就发不出，
#     把它设成高危只会让人误以为"起草"是危险动作）
#   - mail.send：真的发到别人邮箱，**发出去收不回来** ⇒ dangerous
#   - mail.account.add/remove：写凭证、改账号 ⇒ write_file

  - name: mail.account.add
    tier: write_file

  - name: mail.account.list
    tier: read

  - name: mail.account.remove
    tier: write_file

  - name: mail.list
    tier: read

  - name: mail.read
    tier: read

  - name: mail.search
    tier: read

  - name: mail.draft
    tier: read

  - name: mail.send
    tier: dangerous
  # ── 日历（T6，2026-10-20）──────────────────────────────────────
  #
  # **两个都是 read 档**，因为这一版日历是纯只读的：没有任何写入方法。
  # 想加"创建日程"必须新开一个写档工具并走审批 ——
  # 让"读"和"写"共用同一个工具名，等于把审批绕过去了。
  - name: calendar.list
    tier: read
  - name: calendar.conflicts
    tier: read

  # ── 日历写回（T7，2026-10-21）─────────────────────────────────
  #
  # 写档与 mail 的分级同理（写本地文件/动别人日程是两回事）：
  #   - calendar.add / edit / delete：只动本地日历文件（<dataDir>/calendar/local.ics），
  #     订阅 .ics 永远只读 ⇒ write_file（和 fs.write 同档，可审计可重放，不用弹卡）。
  #     add 是内容幂等的（同 标题+开始+结束 返回已有事件），重放无副作用。
  - name: calendar.add
    tier: write_file
  - name: calendar.edit
    tier: write_file
  - name: calendar.delete
    tier: write_file
  # 2026-10-22：节假日/调休查询与休息窗口推荐。纯只读 GET（公开节假日表 + open-meteo 天气），
  # 不碰主人的日历文件，也不需要凭据 ⇒ read 档，不弹审批。
  - name: calendar.day
    tier: read
  - name: calendar.rest
    tier: read
  # 连接器第一批（2026-10-21，task-2 接线）：全是只读 GET，tier: read。
  # GitHub 未配 token 时 issues/pulls 仍可用（公开仓，60 请求/时限速）；notifications 需要 token。
  - name: github.notifications
    tier: read
  - name: github.issues
    tier: read
  - name: github.pulls
    tier: read
  - name: rss.read
    tier: read
  # A2（2026-10-21）：保险库条目名清单；值不进模型，browser.act 用 $vault:site:user 占位。
  - name: vault.sites
    tier: read
  # W2（2026-10-21）：宿主侧浏览器（agent-browser CLI）。
  # snapshot/read 只读，act 是网页操作的唯一出口 —— 三个都放 read 档，不弹审批
  # （主人明确"浏览器控制不需要审批，重大决定才需要"）。危险动作由 spend 档把关。
  - name: web.snapshot
    tier: read
  - name: web.read
    tier: read
  - name: web.act
    tier: read
  # 2026-10-22：宿主侧搜索（argo CLI）。只读网络，不弹审批：
  # 参数只影响 query/url，可执行文件与子命令名在代码里写死。
  - name: search.web
    tier: read
  - name: search.fetch
    tier: read
