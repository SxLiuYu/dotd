# tools.yml —— 工具档位目录（GOV §2.2 语义 + 契约 M5/§9.1 的 11 名工具词表）
#
# 词表来源（§9.1 目录树注释点名，与接缝契约 M5、EX §5.3 ToolName 逐字一致）：
#   fs.read / fs.write / fs.list / fs.stat / shell.run
#   browser.open / browser.act / browser.snapshot / browser.close / net.get / net.post
# 共 11 个。治理 tools.yml 登记这 11 个名字（契约 M5）。
#
# 与 GOV §2.2 原示例的差异（原示例已被下述裁决取代，不是漏抄）：
#   1. 工具名按 §9.1/M5/EX §5.3 定稿：原稿的 browser.navigate→browser.open、
#      browser.purchase→（取消，购物即 browser.act）、shell.exec→shell.run。
#   2. **无 identityParam 字段**：接缝契约 G1 裁决，登录态谓词改顶层 ToolCall.identity，
#      GOV §2.2/§2.3 的 identityParam 字段与 zod 必填校验作废（契约 G1 连锁修改）。
#   3. browser.* 五档归类按 GOV 五档制 + §9.3 默认策略（browser→review）。
#
# 档位五档（GOV §2，§9.3 默认策略）：read / write_file / browser / spend / dangerous
#   read/write_file→allow；browser→review（低智能前审放行，判危转人工）；
#   spend→approve 一律人工；dangerous→approve+Web 勾选确认。
#   upgrade.whenContains 子串命中提档；rules.yml 只能收紧不能放宽；未登记工具一律 deny。

tools:
  - name: fs.read
    tier: read
    # 限额分层（契约 M6）：EX 物理兜底 fs.read≤4MB；MEM 策略层更严者生效
  - name: fs.write
    tier: write_file
    pathPrefixes: ["/dot/home/"]           # 写范围约束，执行面同享此契约（GOV §2.2/S2）
    # 限额分层（契约 M6）：EX 物理兜底 fs.write≤8MB
  - name: fs.list
    tier: read
    # EX §7：目录枚举/mtime/size，深度 ≤4
  - name: fs.remove
    # **dangerous 而不是 write_file**（2026-10-19 实测改）：
    # 最初定 write_file，结果模型面对"用 rm -rf 删目录"（shell.run 会触发审批）时
    # **改用 fs.remove 逐个删**，完全绕过审批。归档可恢复是对的，但"绕过审批"不行。
    # 删除是破坏性动作，按 GOV 五档该进人工确认。
    tier: dangerous
  - name: fs.stat
    tier: read
    # EX §7：mtime/size
  - name: shell.run
    tier: write_file                        # 容器内 shell（EX §7：bash -c，cwd=/dot/home，超时必填）
    upgrade:                                # 命中即提档（解析规则见 GOV §3.1）
      tier: dangerous
      # **出网命令必须在此**（2026-10-19 实测发现）：容器里 curl/wget/python 都能出网，
      # 而 DOTD_NET_TOOLS=get 只限制 net.* 工具 —— 模型用 `curl -X POST` 就能完全绕过
      # net.post 的管控（实测 curl POST 拿到 HTTP 200）。同理 nc/telnet/ssh 等也是通路。
      # 加这一批的代价：正常的"用 curl 抓个网页"会走审批。这是有意的 ——
      # 想抓网页请用 net.get（read 档，直接放行），shell 里的网络命令一律当危险动作。
      # 匹配对象是**整个 JSON 参数**（gate.ts upgradeHit: JSON.stringify(params) 子串命中），
      # 所以 /`https://` 这种"URL 形态"词能一网打尽所有出网写法（curl/wget/python urllib/
      # git clone/node fetch…），比穷举命令名可靠得多。2026-10-19 实测：
      # 只列 curl/wget 时，`python3 -c "import urllib.request; urlopen('https://…')"` 直接绕过。
      whenContains: ["rm ", "sudo ", "docker ", "> /dev/", "http://", "https://", "ftp://", "ssh://", "rmdir", "unlink", "shred", "truncate", "curl ", "wget ", "nc ", "ncat", "telnet ", "ssh ", "scp ", "rsync "]
  - name: browser.open
    tier: read                              # 只导航不交互
  - name: browser.act                       # click/type/submit 合并为一个动作工具
    tier: browser                           # §9.3：browser→review
    # 登录态判定不在此声明（契约 G1 作废 identityParam）：
    # isLoginSensitive(call) = call.tool.startsWith('browser.')
    #                          && call.identity != null && call.identity !== 'anon'
  - name: browser.snapshot
    tier: read                              # 读取当前页面结构，无副作用
  - name: browser.close
    tier: read                              # 关 context，profile 留卷上（EX §5.5）
  - name: net.get
    tier: read
  - name: net.post
    tier: write_file                        # 对外 POST 有副作用：比 GET 高一档（GOV §2.2）

  # ── 定时任务（2026-10-18，对标 OpenAI bot 的"每天 9 点提醒我"）──────────────
  # 这两个是**宿主侧工具**：由 daemon 直接执行（改 crontabs 表），不进容器。
  # 为什么 schedule.create 是 write_file 档：它会在控制面创建一条长期存在的调度记录，
  # 到点自动触发任务 —— 属于"改了系统状态"，不是只读查询。
  - name: schedule.create
    tier: write_file
  - name: schedule.remove
    tier: write_file                        # 停用而非硬删（enabled=0，可恢复）
  - name: schedule.list
    tier: read

  # ── P2-1：外部工具网关（MCP）──────────────────────────────────────────────
  # 为什么是 dangerous 而不是 spend/write_file：
  #   spend 要求 spendParams.required（金额等固定字段），而 MCP 工具的参数是**任意**的，
  #   无法预先声明"要花多少钱"——用 spend 会被 catalog 校验拒掉（GOV §2.3）。
  #   dangerous 才是这里唯一正确的档：
  #     - 一律人工审批（approve_once，不参与 `all` 批量批准）；
  #     - 应急模式（EMERGENCY）直接冻结（gate.ts:392）；
  #     - 治理审计里带 tier，复盘能一眼看出"这是外部工具"。
  # **这条不要放宽**：外部 MCP server 的行为我们不知道，它可能在宿主上发网络请求、
  # 读环境变量、写任意文件。给它 write_file/read 档等于让用户无感地执行第三方代码。
  #
  # 默认**不启用**：本条目只声明"如果 mcp.call 出现，按最严档管"。
  # 是否真的出现，取决于 config/tools.yml 的 mcp_servers 段是否声明了 server
  # （空 = 完全不启用，模型看不到这个工具）。
  - name: mcp.call
    tier: dangerous

# ── spend 档条目（结构定型，§9.3：花钱一律人工审批）──────────────────────────
# GOV §2.3 校验细则：tier == "spend" 的条目必须带 spendParams（缺则加载失败）。
# 阶段一工具词表（§9.1/M5）无 spend 档工具；购物走 browser.act 由 review 承接。
# 阶段二接入支付/下单类工具时按此形状补条目（含 spendParams.required）：
#
#   - name: shop.checkout
#     tier: spend
#     spendParams:
#       required: [amountCents, currency, category]
# ─────────────────────────────────────────────────────────────────────────────
