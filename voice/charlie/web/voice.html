<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Charlie · 语音助理</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap');
*{margin:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--fg);
  min-height:100dvh;display:flex;flex-direction:column;padding:0;max-width:720px;margin:0 auto;width:100%}
/* Header */
#top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0;width:100%}
#top-left{display:flex;flex-direction:column}
h1{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.sub{color:var(--muted);font-size:11px;font-weight:400}
#status-bar{display:flex;gap:12px;align-items:center}
#status-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0}
#status-dot.away{background:#ef4444}
#status-dot.sleep{background:#8b5cf6}
#status-text{font-size:11px;color:var(--muted)}
/* Orb */
#orb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--accent),#52525b);
  box-shadow:0 2px 8px rgba(0,0,0,.1);margin:24px auto 8px;
  display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;flex-shrink:0;color:#fafafa;transition:all .2s}
#orb.listening{box-shadow:0 0 0 3px rgba(59,130,246,.2),0 2px 12px rgba(59,130,246,.15)}
#orb.thinking{box-shadow:0 0 0 3px rgba(168,85,247,.2),0 2px 12px rgba(168,85,247,.15)}
#orb.speaking{box-shadow:0 0 0 3px rgba(34,197,94,.2),0 2px 12px rgba(34,197,94,.15)}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#orb.listening,#orb.thinking,#orb.speaking{animation:p .8s infinite}
#status{font-size:11px;color:var(--muted);margin-bottom:10px;min-height:16px;text-align:center;font-weight:400}
/* Controls */
#controls{display:flex;gap:4px;margin-bottom:8px;align-items:center;justify-content:center;flex-wrap:wrap}
#controls button,#panel-tabs button{font-family:Inter,sans-serif;padding:5px 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--card);color:var(--muted);font-size:11px;cursor:pointer;transition:all .15s;user-select:none}
#controls button:hover{border-color:var(--muted);color:var(--fg);background:var(--hover)}
#holdbtn{padding:6px 20px;background:var(--accent);color:var(--bg);border:none;font-weight:500;font-size:12px}
#holdbtn:active{background:#3f3f46}
#holdbtn:hover{background:#27272a;color:var(--bg);border:none}
#wakebtn.off,#autobtn.off{opacity:.4}
/* Chat */
#conv{width:100%;padding:0 16px;max-height:40vh;overflow-y:auto;margin-bottom:6px;flex:1}
.msg{margin:3px 0;padding:5px 10px;border-radius:6px;font-size:13px;line-height:1.5;word-break:break-word}
.msg.u{text-align:right;color:var(--muted)}
.msg.b{color:var(--fg);border-left:2px solid var(--border)}
.msg.b.streaming{border-left-color:var(--accent)}
.msg.sys{color:var(--muted);font-style:italic;font-size:11px}
/* Input */
#textinput{display:flex;gap:6px;padding:0 16px;margin-bottom:6px;width:100%}
#textinput input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:Inter,sans-serif;outline:none;transition:border-color .15s}
#textinput input:focus{border-color:var(--accent)}
#textinput button{padding:8px 14px;border:none;border-radius:6px;background:var(--accent);color:var(--bg);font-size:12px;cursor:pointer;font-family:Inter,sans-serif;font-weight:500}
#textinput button:hover{background:var(--muted)}
#textinput button:last-child{background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:8px 10px}
#textinput button:last-child:hover{color:var(--fg);background:var(--hover)}
/* Tunnel URL */
#tunnelurl{font-size:10px;color:var(--muted);margin-bottom:2px;text-align:center;cursor:pointer;display:none}
#diag{font-size:10px;color:var(--muted);padding:0 16px;margin-bottom:6px;text-align:center;line-height:1.4}
/* Vol bar */
#volwrap{width:140px;margin:2px auto 6px;display:none}
#volbarbg{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
#volbar{height:100%;width:0;background:var(--accent);transition:width .05s}
#controls button.active,#wakebtn.active,#autobtn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);opacity:1}
#controls button.active:hover{background:#27272a}
#controls button:active{background:var(--border);transform:scale(0.97)}
#holdbtn:active{transform:scale(0.97)}
#holdbtn.active{background:#3f3f46;color:#fff}
/* Panel tabs */
#panel-tabs{display:flex;gap:4px;padding:0 16px;margin-bottom:6px}
#panel-tabs button{font-size:10px;padding:3px 10px}
#panel-tabs button.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
/* Panel content */
.panel-content{display:none;padding:0 16px;margin-bottom:8px;max-height:200px;overflow-y:auto;font-size:12px}
.panel-content.active{display:block}
.panel-content input,.panel-content select{width:100%;padding:6px 8px;margin-bottom:4px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--fg);font-size:12px;font-family:Inter,sans-serif;outline:none}
.panel-content input:focus{border-color:var(--accent)}
.panel-content .btn-row{display:flex;gap:4px;margin-bottom:6px}
.panel-content .btn-row button{font-size:10px;padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--muted);cursor:pointer;font-family:Inter,sans-serif}
.panel-content .btn-row button:hover{color:var(--fg);background:var(--hover)}
/* Reminder items */
.remitem,.prefitem{display:flex;align-items:center;gap:6px;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border)}
.remitem .rtxt,.prefitem .pv{flex:1;color:var(--fg)}
.remitem .rtime,.prefitem .pk{color:var(--muted);font-size:10px;min-width:80px}
.remitem .rdel,.prefitem .pdel{cursor:pointer;color:var(--muted);font-size:14px;padding:0 4px}
.remitem .rdel:hover,.prefitem .pdel:hover{color:#22c55e}
.remitem.done .rtxt{text-decoration:line-through;opacity:.5}
/* Export */
#exportnote{font-size:10px;color:var(--muted);margin-top:2px}
/* Theme */
:root{--bg:#fafafa;--fg:#18181b;--card:#fff;--border:#e4e4e7;--muted:#a1a1aa;--accent:#18181b;--hover:#f4f4f5}
.dark{--bg:#0a0a0f;--fg:#d4d4d8;--card:#14141a;--border:#27272a;--muted:#52525b;--accent:#f4f4f5;--hover:#1a1a22}
@media(max-width:480px){body{padding:0}#orb{margin:18px auto 8px}}
</style></head><body>
<div id="top">
<div id="top-left">
<h1>Charlie</h1>
<div class="sub">语音助理</div>
</div>
<button id="theme-toggle" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--muted);font-family:Inter,sans-serif">🌓</button>
<a href="/welcome" id="setup-entry" style="background:var(--card);border:1px solid var(--accent,#6366f1);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:#fff;background-color:#6366f1;text-decoration:none;font-family:Inter,sans-serif;white-space:nowrap">⚙️ 配置引导</a>
<div id="status-bar">
<span id="status-dot"></span>
<span id="status-text">就绪</span>
</div>
</div>
<div id="diag">点击球授权麦克风，开启自动监听…</div>

<div id="status">点击球授权麦克风</div>
<div id="volwrap"><div id="volbarbg"><div id="volbar"></div></div></div>

<div id="textinput">
<input id="msginput" placeholder="打字也行… 6个MCP流式回复">

<div id="panel-tabs">

<input id="prefkey" placeholder="偏好名称">

</div>

 <h3 style="margin:0 0 8px;font-size:13px;color:var(--accent)">⬇️ 对话导出</h3>
 <div class="btn-row">
<select id="exportformat"><option value="txt">纯文本</option><option value="markdown">Markdown</option><option value="json">JSON</option></select>
<input id="exportfrom" type="date" placeholder="开始日期">
<input id="exportto" type="date" placeholder="结束日期">

</div>
<script>
// ===== 会话ID =====
function genSessionId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
let SESSION_ID=localStorage.getItem('magic_session_id')||genSessionId();
localStorage.setItem('magic_session_id',SESSION_ID);
const exportSessionId=SESSION_ID;

// ===== 面板切换 =====
function switchPanel(name,btn){
  document.querySelectorAll('.panel-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('#panel-tabs button').forEach(el=>el.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
}

// ===== 定位 =====
function reportLocation(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(
    pos=>{const{latitude:lat,longitude:lng,accuracy:acc}=pos.coords;
      if(wsReady&&wsConn&&wsConn.readyState===1)wsConn.send(JSON.stringify({type:'location',lat,lng,accuracy:acc}));
      console.log('📍 位置已上报:',lat,lng,'±'+acc+'m');},
    err=>console.log('定位失败:',err.message),
    {enableHighAccuracy:true,timeout:10000,maximumAge:30000}
  );
}
let locationWatchId=null;
if(navigator.geolocation){
  locationWatchId=navigator.geolocation.watchPosition(
    pos=>{const{latitude:lat,longitude:lng,accuracy:acc}=pos.coords;
      if(wsReady&&wsConn&&wsConn.readyState===1)wsConn.send(JSON.stringify({type:'location',lat,lng,accuracy:acc}));},
    err=>console.log('位置监听:',err.message),
    {enableHighAccuracy:true,timeout:10000,maximumAge:60000}
  );
}

// ===== 状态栏 =====
function updateStatusBar(){
  fetch('/api/status').then(r=>r.json()).then(d=>{
    const dot=document.getElementById('status-dot');
    const txt=document.getElementById('status-text');
    if(d.brain_ready){dot.className='';txt.textContent='就绪';}
    else{dot.className='sleep';txt.textContent='预热中';}
  }).catch(()=>{});
}
setInterval(updateStatusBar,10000);
updateStatusBar();

// ===== 剪贴板 =====
let lastClipboard='';
function checkClipboard(){
  if(!document.hasFocus())return;
  navigator.clipboard.readText().then(text=>{
    if(text&&text!==lastClipboard&&text.length>5){
      lastClipboard=text;
      if(wsReady&&wsConn&&wsConn.readyState===1)wsConn.send(JSON.stringify({type:'clipboard',text:text.slice(0,200),session_id:SESSION_ID}));
    }
  }).catch(()=>{});
}
setInterval(checkClipboard,5000);

// ===== 会话同步 =====
function getSessionShareURL(){return location.origin+'?session='+SESSION_ID;}
function copySessionURL(){
  const url=getSessionShareURL();
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>showTunnelURL(url));
  else showTunnelURL(url);
}
function showTunnelURL(url){
  const el=document.getElementById('tunnelurl');
  el.textContent='🔗 跨终端链接: '+url;
  el.style.display='block';
}
(function(){
  const params=new URLSearchParams(location.search);
  const shared=params.get('session');
  if(shared&&shared.length>4){SESSION_ID=shared;localStorage.setItem('magic_session_id',SESSION_ID);addMsg('sys','🔗 已加入共享会话: '+shared.slice(0,8));}
})();

const st=document.getElementById('status'),diag=document.getElementById('diag'),conv=document.getElementById('conv');
const orb=document.getElementById('orb'),volbar=document.getElementById('volbar'),volnum=document.getElementById('volnum');
let micStream=null,audioCtx=null,analyser=null,mediaRecorder=null;
let state='idle',mic=false,autoListen=true,recChunks=[],recStart=0;
let soundTimer=null,silenceTimer=null,cooldownTimer=null,streamingMsg=null;
let curVolume=0;
const SOUND_THRESHOLD=0.2,SILENCE_THRESHOLD=0.3,SOUND_DELAY=300,SILENCE_DELAY=1500,COOLDOWN=1200;

function setState(s,icon,txt){
  if(state==='speaking'&&s==='listening'&&!userInitiatedInterrupt)return;
  state=s;orb.textContent=icon;orb.className=s;st.textContent=txt;
}
let userInitiatedInterrupt=false;
function addMsg(cls,txt,ts){
  const d=document.createElement('div');d.className='msg '+cls;
  if(ts){const t=document.createElement('span');t.style.cssText='font-size:10px;color:var(--muted);margin-right:6px';t.textContent=ts.slice(11,16);d.appendChild(t);}
  const s=document.createElement('span');s.textContent=txt;d.appendChild(s);
  conv.appendChild(d);conv.scrollTop=conv.scrollHeight;return d;}
function addReplyChunk(txt){if(!streamingMsg)streamingMsg=addMsg('b streaming','');streamingMsg.textContent+=txt;conv.scrollTop=conv.scrollHeight;}
function finishReply(){if(streamingMsg){streamingMsg.classList.remove('streaming');streamingMsg=null;}}

// ===== Safari音频解锁 =====
let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked)return;
  try{const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');a.volume=0;const p=a.play();if(p&&p.then)p.then(()=>{audioUnlocked=true;}).catch(()=>{});}catch(e){}
}
function ensureUnlock(){
  if(audioUnlocked)return Promise.resolve();
  return new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=').play().then(()=>{audioUnlocked=true;}).catch(()=>{});
}

// ===== 音频队列 =====
let audioQueue=[],isPlaying=false,currentSrcNode=null,currentHtmlAudio=null,audioPlaybackGeneration=0;
const BARGE_THRESHOLD=0.45,BARGE_DELAY=650,BARGE_START_GUARD_MS=900;
let bargeTimer=null,abortCtrl=null,speakingStartedAt=0;
function b64ToUint8(b64){const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function enqueueAudio(b64mp3){audioQueue.push(b64mp3);if(!isPlaying)playNextAudio();}
function playNextAudio(){
  if(audioQueue.length===0){isPlaying=false;speakingStartedAt=0;setState('idle','🎙️','在听…');const sb=document.getElementById('stopbtn');if(sb)sb.style.display='none';startCooldown();return;}
  const playbackGeneration=++audioPlaybackGeneration;if(!isPlaying)speakingStartedAt=Date.now();isPlaying=true;setState('speaking','🔊','朗读中…');const sb=document.getElementById('stopbtn');if(sb)sb.style.display='inline-block';
  const b64=audioQueue.shift();
  if(audioCtx&&audioCtx.state==='running'){
    try{audioCtx.decodeAudioData(b64ToUint8(b64).buffer,function(buf){
      if(playbackGeneration!==audioPlaybackGeneration)return;
      const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);
      currentSrcNode=src;src.onended=function(){if(playbackGeneration!==audioPlaybackGeneration||currentSrcNode!==src)return;currentSrcNode=null;playNextAudio();};src.start();
    },function(){if(playbackGeneration!==audioPlaybackGeneration)return;htmlAudioFallback(b64);});return;
    }catch(e){}
  }
  htmlAudioFallback(b64);
}
function htmlAudioFallback(b64){
  const audioUrl=URL.createObjectURL(new Blob([b64ToUint8(b64)],{type:'audio/mpeg'}));
  const audio=new Audio(audioUrl);
  const playbackGeneration=audioPlaybackGeneration;let released=false;
  function releaseHtmlAudioUrl(){if(released)return;released=true;try{URL.revokeObjectURL(audioUrl);}catch(e){}}
  audio._releaseHtmlAudioUrl=releaseHtmlAudioUrl;currentHtmlAudio=audio;
  audio.onended=function(){releaseHtmlAudioUrl();if(playbackGeneration!==audioPlaybackGeneration||currentHtmlAudio!==audio)return;currentHtmlAudio=null;playNextAudio();};
  audio.onerror=function(){releaseHtmlAudioUrl();if(playbackGeneration!==audioPlaybackGeneration||currentHtmlAudio!==audio)return;currentHtmlAudio=null;playNextAudio();};
  audio.play().catch(()=>{releaseHtmlAudioUrl();if(playbackGeneration!==audioPlaybackGeneration||currentHtmlAudio!==audio)return;setState('idle','🎙️','在听…');isPlaying=false;startCooldown();});
}

// ===== SSE流解析 =====
async function streamSSE(response,onEvent){
  const reader=response.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines)if(ln.startsWith('data: '))try{onEvent(JSON.parse(ln.slice(6)));}catch(e){}}
}
// ===== 音乐播放 =====
let musicAudio=null,audioCtxUnlocked=false;
function unlockAudioContext(){
  if(audioCtxUnlocked)return;
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();
    const buf=ctx.createBuffer(1,1,22050);const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start(0);
    audioCtxUnlocked=true;console.log('[audio] AudioContext已解锁');
  }catch(e){console.log('[audio] 解锁失败:',e);}
}
function playMusicUrl(url,name,artist){
  stopMusicUrl();unlockAudioContext();
  musicAudio=new Audio(url);musicAudio.crossOrigin='anonymous';musicAudio.volume=1.0;
  musicAudio.play().then(()=>{
    addMsg('sys','🎵 正在播放：'+name+(artist?' - '+artist:''));
    setState('idle','🎵','播放中…');
  }).catch(e=>{
    musicAudio=new Audio(url);musicAudio.volume=1.0;
    musicAudio.play().then(()=>{addMsg('sys','🎵 正在播放：'+name+(artist?' - '+artist:''));setState('idle','🎵','播放中…');})
    .catch(e2=>{addMsg('sys','⚠️ 播放失败：'+e2.message);setState('idle','🎙️','在听…');});
  });
  musicAudio.onended=function(){musicAudio=null;setState('idle','🎙️','在听…');startCooldown();};
  musicAudio.onerror=function(){musicAudio=null;setState('idle','🎙️','在听…');startCooldown();};
}
function stopMusicUrl(){if(musicAudio){musicAudio.pause();musicAudio.src='';musicAudio=null;}}
function handleStreamEvent(data){
  switch(data.type){
    case'text':
      if(data.text&&data.text.startsWith('__MUSIC__')){const parts=data.text.split('__');playMusicUrl(parts[2],parts[3]||'',parts[4]||'');break;}
      if(data.text&&data.text==='__MUSIC_STOP__'){stopMusicUrl();addMsg('sys','⏹️ 音乐已停止');setState('idle','🎙️','在听…');break;}
      addReplyChunk(data.text);break;
    case'asr':addMsg('u',data.text);streamingMsg=null;setState('thinking','🧠','正在思考…');break;
    case'ack':setState('thinking','👂','嗯，让我想想…');break;
    case'audio':if(state==='listening'&&!isPlaying){setState('synthesizing','🎵','正在合成语音…');enqueueAudio(data.audio);}
      else if(state!=='listening'){if(state==='thinking')setState('synthesizing','🎵','正在合成语音…');enqueueAudio(data.audio);}break;
    case'done':finishReply();userInitiatedInterrupt=false;if(!isPlaying&&audioQueue.length===0&&!musicAudio){setState('idle','🎙️','在听…');startCooldown();}break;
    case'error':addMsg('sys','⚠️ '+(data.message||'错误'));setState('idle','🎙️','在听…');startCooldown();break;
    case'warning':addMsg('sys','🔈 '+(data.message||'语音暂时不可用'));break;
  }
}

async function init(){
  if(mic)return;
  unlockAudio();
  // 非 HTTPS 下 navigator.mediaDevices 为 undefined
  if(!navigator.mediaDevices){
    diag.textContent='❌ 麦克风不可用 — 请用 HTTPS 访问（手机用隧道公网URL或局域网 https 地址，见首页 /api/lan-info）';
    st.textContent='HTTPS 需要麦克风';
    return;
  }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});
    mic=true;diag.textContent='✅ 麦克风就绪 · 自动监听已'+(autoListen?'开启':'关闭');
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume().catch(()=>{});}
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=0.6;
    src.connect(analyser);updateVolume();setState('idle','🎙️','在听…');
  }catch(e){diag.textContent='❌ 麦克风错误:'+e.message+' — 可用打字';}
}
function updateVolume(){
  if(!analyser)return;
  const d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);
  let v=0;for(let i=0;i<d.length;i++)v+=d[i];v=v/d.length/255*3;curVolume=v;
  volbar.style.width=Math.min(100,v*40)+'%';volnum.textContent='音量 '+v.toFixed(1);
  if(autoListen&&state==='idle'&&!cooldownTimer&&!wakeMode){
    if(v>SOUND_THRESHOLD){if(!soundTimer)soundTimer=setTimeout(()=>{if(state==='idle'&&autoListen&&!cooldownTimer)startAutoRecord();},SOUND_DELAY);}
    else{clearTimeout(soundTimer);soundTimer=null;}
  }
  if(autoListen&&state==='speaking'&&isPlaying){
    if(v>BARGE_THRESHOLD&&Date.now()-speakingStartedAt>=BARGE_START_GUARD_MS){if(!bargeTimer)bargeTimer=setTimeout(()=>{if(state==='speaking'&&isPlaying)bargeIn();},BARGE_DELAY);}
    else{clearTimeout(bargeTimer);bargeTimer=null;}
  }
  //静默停止
  if(state==='listening'&&v<SILENCE_THRESHOLD){if(!silenceTimer)silenceTimer=setTimeout(()=>{if(state==='listening')stopAutoRecord();},SILENCE_DELAY);}
  else if(state==='listening'){clearTimeout(silenceTimer);silenceTimer=null;}
  requestAnimationFrame(updateVolume);
}
function toggleAuto(){
  autoListen=!autoListen;const btn=document.getElementById('autobtn');
  if(!mic){autoListen=false;btn.textContent='自动监听 OFF';diag.textContent='⚠️ 请先点击球授权麦克风';return;}
  btn.textContent='自动监听 '+(autoListen?'ON':'OFF');btn.classList.toggle('active',autoListen);btn.className=autoListen?'':'off';
  diag.textContent='自动监听已'+(autoListen?'开启':'关闭');
  if(!autoListen){clearTimeout(soundTimer);clearTimeout(silenceTimer);clearTimeout(bargeTimer);}
}

const pollEtags={reminders:'',preferences:'',tunnel:''};
async function fetchPollJSON(url,etagKey,options={}){
  const headers={};
  if(!options.force&&pollEtags[etagKey])headers['If-None-Match']=pollEtags[etagKey];
  const{force,...fetchOptions}=options;
  const r=await fetch(url,{headers,...fetchOptions});
  const etag=r.headers.get('ETag');
  if(etag)pollEtags[etagKey]=etag;
  if(r.status===304)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

let evtSource=null;
function initSSE(){
  if(evtSource)evtSource.close();
  try{evtSource=new EventSource('/api/events');
    evtSource.onmessage=function(e){try{const n=JSON.parse(e.data);
      if(n.type==='heartbeat'||n.type==='connect')return;
      // 纯音频事件（如提醒到期 TTS）：播放音频，不渲染文字气泡，避免出现"⏰ undefined"
      if(n.type==='audio'){if(n.audio){enqueueAudio(n.audio);}return;}
      // 其余通知需有 text 才渲染
      if(!n.text)return;
      const icon=n.type==='weather'?'🌦️':n.type==='morning'?'☀️':n.type==='bedtime'?'🌙':n.type==='health'?'⚠️':n.type==='reminder'?'🔔':'⏰';
      addMsg('b',icon+' '+n.text);
      if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(n.text.replace(/[\n#*]/g,' '));u.lang='zh-CN';u.rate=1.05;speechSynthesis.speak(u);}
    }catch(err){}};
    evtSource.onerror=function(){evtSource.close();setTimeout(initSSE,5000);};
  }catch(e){}
}
// ===== WebSocket =====
let wsConn=null,wsReady=false;
function wsConnect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  try{
    wsConn=new WebSocket(proto+'//'+location.host+'/ws');
    wsConn.onopen=()=>{wsReady=true;const oldDiag=diag.textContent;
      diag.textContent='✅ 实时连接已建立 · '+(oldDiag.replace(/^[✅📡❌].*?· /,''));
      if(!evtSource||evtSource.readyState===EventSource.CLOSED)initSSE();};
    wsConn.onclose=()=>{wsReady=false;diag.textContent='📡 实时连接断开,5秒后重连…';setTimeout(wsConnect,5000);};
    wsConn.onerror=()=>{wsReady=false;};
    wsConn.onmessage=(e)=>{try{const data=JSON.parse(e.data);
      switch(data.type){
        case'connect':diag.textContent='✅ '+data.text+' · 自动监听已'+(autoListen?'开启':'关闭');break;
        case'pong':break;
        case'asr':addMsg('u',data.text);streamingMsg=null;setState('thinking','🧠','正在思考…');break;
        case'ack':setState('thinking','👂','嗯，让我想想…');break;
        case'text':addReplyChunk(data.text);if(state==='thinking')setState('thinking','🧠','正在思考…');break;
        case'audio':if(data.data&&state!=='listening'){if(state==='thinking')setState('synthesizing','🎵','正在合成语音…');enqueueAudio(data.data);}break;
        case'done':finishReply();if(!isPlaying&&audioQueue.length===0){setState('idle','🎙️','在听…');startCooldown();}break;
        case'error':addMsg('sys','⚠️ '+(data.message||'错误'));setState('idle','🎙️','在听…');startCooldown();break;
        case'warning':addMsg('sys','🔈 '+(data.message||'语音暂时不可用'));break;
        case'interrupted':stopAllAudio();finishReply();if(state==='speaking'||state==='idle'){setState('idle','🎙️','已打断,在听…');startCooldown();}break;
        case'location_ack':addMsg('sys','📍 '+data.address);break;
      }}catch(err){}};
  }catch(e){setTimeout(wsConnect,5000);}
}
async function sendTextWS(msg){
  if(wsReady&&wsConn&&wsConn.readyState===1){
    addMsg('u',msg);setState('thinking','🧠','正在思考…');streamingMsg=null;
    wsConn.send(JSON.stringify({type:'text',message:msg,session_id:SESSION_ID}));
    return true;
  }
  return false;
}
function stopAllAudio(){
  audioQueue=[];clearTimeout(bargeTimer);bargeTimer=null;audioPlaybackGeneration++;if(isPlaying)isPlaying=false;speakingStartedAt=0;
  if(currentSrcNode){try{currentSrcNode.onended=null;currentSrcNode.stop();}catch(e){}currentSrcNode=null;}

  const sb=document.getElementById('stopbtn');if(sb)sb.style.display='none';

function abortActiveStream(){if(abortCtrl){try{abortCtrl.abort();}catch(e){}abortCtrl=null;}}
function captureInterruptedReply(){
  if(streamingMsg)return streamingMsg.textContent||'';
  const msgs=conv.querySelectorAll('.msg.b:not(.streaming)');
  return msgs.length?(msgs[msgs.length-1].textContent||''):'';
}
function buildInterruptPayload(){
  const reply=captureInterruptedReply();
  return reply?{type:'interrupt',interrupted_reply:reply.slice(-200)}:{type:'interrupt'};
}
function interruptTTS(){
  stopAllAudio();abortActiveStream();
  if(wsReady&&wsConn&&wsConn.readyState===1)wsConn.send(JSON.stringify(buildInterruptPayload()));
  finishReply();setState('idle','🎙️','已打断,在听…');startCooldown();
}
//自动打断(barge-in)
function bargeIn(){userInitiatedInterrupt=true;
  clearTimeout(bargeTimer);bargeTimer=null;stopAllAudio();abortActiveStream();
  if(wsReady&&wsConn&&wsConn.readyState===1)wsConn.send(JSON.stringify(buildInterruptPayload()));
  finishReply();
  if(!micStream){setState('idle','🎙️','在听…');startCooldown();return;}
  recChunks=[];mediaRecorder=new MediaRecorder(micStream,{mimeType:MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':''});
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=onAutoRecordStop;mediaRecorder.start();recStart=Date.now();
  setState('listening','👂','已打断,聆听中…');addMsg('sys','⚡ 打断TTS,我在听');
}

let wakeMode=false,wakeRecognition=null;

function startWakeWordDetection(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){diag.textContent='❌ 浏览器不支持语音唤醒，请用Chrome';return;}
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  wakeRecognition=new SpeechRecognition();
  wakeRecognition.continuous=true;wakeRecognition.interimResults=false;wakeRecognition.lang='en-US';
  wakeRecognition.onresult=function(event){
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t=event.results[i][0].transcript.toLowerCase();
      if(t.includes('charlie')||t.includes('查理')||t.includes('查里')){
        console.log('🎤 唤醒词检测到:',t);
        wakeRecognition.stop();wakeMode=false;
        document.getElementById('wakebtn').className='off';document.getElementById('wakebtn').textContent='唤醒词 OFF';
        if(!mic)init().then(()=>startAutoRecord());else startAutoRecord();

    console.log('唤醒监听错误:',event.error);
    if(event.error!=='aborted'&&event.error!=='not-allowed')setTimeout(()=>{if(wakeMode)startWakeWordDetection();},1000);
  };
  wakeRecognition.onend=function(){if(wakeMode)startWakeWordDetection();};
  wakeRecognition.start();diag.textContent='👂 等待唤醒...';
}

    else{startWakeWordDetection();diag.textContent='👂 等待唤醒...说"Charlie"或"查理"';}
  }else{

const pollJobs=[
  {name:'reminders',interval:60000,failures:0,paused:false,run:refreshRems},
  {name:'preferences',interval:120000,failures:0,paused:false,run:refreshPrefs},
  {name:'tunnel',interval:120000,failures:0,paused:false,run:loadTunnelURL}

let pollTimers={};
function reportPollingTelemetry(event,job=''){const body={event};if(job)body.job=job;fetch('/api/polling-telemetry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true}).catch(()=>{});}
function clearPolls(){Object.values(pollTimers).forEach(clearTimeout);pollTimers={};}
function schedulePoll(job){
  if(document.hidden){if(!job.paused){job.paused=true;reportPollingTelemetry('paused',job.name);}return;}
  job.paused=false;const backoff=Math.min(job.interval*8,job.interval*2**job.failures);
  pollTimers[job.name]=setTimeout(async()=>{try{await job.run();job.failures=0;}catch(e){job.failures+=1;reportPollingTelemetry('error',job.name);}schedulePoll(job);},backoff);
}
function startPolling(){
  pollJobs.forEach(schedulePoll);
  document.addEventListener('visibilitychange',()=>{clearPolls();
    if(document.hidden){pollJobs.forEach(job=>{if(!job.paused){job.paused=true;reportPollingTelemetry('paused',job.name);}});return;}
    reportPollingTelemetry('resumed');pollJobs.forEach(job=>{job.run().catch(()=>{});schedulePoll(job);});});
}

// ===== 主题 =====
function toggleTheme(){
  const html=document.documentElement;html.classList.toggle('dark');
  localStorage.setItem('theme',html.classList.contains('dark')?'dark':'light');
}
(function(){
  if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');
})();
