# 白泽3.0 LLM配置

default: "zhipu"

providers:
  zhipu:
    enabled: true
    type: "openai-compatible"
    baseURL: "https://www.finna.com.cn/v1"
    model: "glm-5.2"
    temperature: 0.7
    maxTokens: 4096
    timeout: 60000

  aliyun:
    enabled: true
    type: "openai-compatible"
    baseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-max"
    temperature: 0.7
    maxTokens: 4096
    timeout: 60000

  ollama:
    enabled: true
    type: "ollama"
    baseURL: "http://localhost:11434"
    model: "qwen2:7b"
    temperature: 0.7
    maxTokens: 4096
    timeout: 120000

strategy:
  taskMapping:
    thinking: "zhipu"
    simple: "zhipu"
    fallback: "aliyun"
